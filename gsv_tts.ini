# ============================================================
# gsv_tts_local.py 的默认参数。填一次，以后只给文本就能合成。
# 命令行上显式写的参数永远优先于这里（临时想换就直接加 --ref 覆盖）。
# 行首 # 是注释。用记事本改完直接保存即可。
# ============================================================

# 整合包根目录。就是有 webui.py 和 GPT_SoVITS 文件夹的那层。
# 保持 "." 表示"就在当前目录运行"，所以请先 cd 到整合包根目录再跑（用 合成.bat 会自动 cd）。
root = .

# 权重版本，必须和训练时一致
version = v2Pro

# ---------- 参考音频（音色样本）：下面两套方案二选一 ----------

# 方案 A（推荐，最简单）：本地放一段 5~7 秒干净人声
ref = .\ref\my7s.wav
ref-text = 这里填那段参考音频里原封不动说的话

# 方案 B：用从 Google Drive 同步下来的训练切片，参考音频和原文都自动查。
# 用方案 B 就把上面 ref / ref-text 两行删掉，改用下面两行：
# ref-dir = G:\My Drive\Colab\output
# list    = G:\My Drive\Colab\output\output.list

# ---------- 其它 ----------

# 长文本怎么切句：punct 按标点(默认) | 50字 | 4句 | 中文句号 | 英文句号 | none
cut = punct

# 参考音频语种 / 合成文本语种
ref-lang = zh
lang = zh

# 输出目录。不写就默认 <整合包根>\tts_out
